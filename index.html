<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>พอร์ตโฟลิโอ</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .portfolio {
      background: #1e293b;
      max-width: 800px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    .left {
      background: linear-gradient(160deg, #2563eb, #1d4ed8);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .left h1 {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .left p {
      font-size: 16px;
      background: rgba(255, 255, 255, 0.2);
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
      width: fit-content;
    }
    .right {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
    }
    .right h2 {
      font-size: 15px;
      color: #38bdf8;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .right p {
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.7;
    }
    .contact-box {
      background: #0f172a;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    @media (max-width: 650px) {
      .portfolio { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="portfolio">
    <div class="left">
      <h1>ศติรุต รื่นรมย์</h1>
      <p>นักศึกษา</p>
    </div>

    <div class="right">
      <div>
        <h2>เกี่ยวกับฉัน</h2>
        <p>สวัสดีครับ ผมสนใจในการเขียนโค้ดเพราะสนุกเวลาเห็นไอเดียในหัวกลายเป็นสิ่งที่กดใช้งานได้จริงบนหน้าจอ</p>
      </div>

      <div>
        <h2>ติดต่อ</h2>
        <div class="contact-box">
          <p>Email:best2307best@gmail.com</p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
